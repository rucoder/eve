org: lfedge
image: eve-nvidia-dgpu
# apt-get and the deb downloads run inside RUN, which has no network in a
# linuxkit build unless declared here (pkg/alpine, pkg/kube-images and others do
# the same). pkg/nvidia avoids this by using ADD for its tarball instead.
network: true
