[package]
name = "eve-gui"
version = "0.1.0"
edition = "2021"
authors = ["Mikhail Malyshev <mike.malyshev@gmail.com>"]
repository = "https://github.com/lf-edge/eve"
rust-version = "1.84"

[profile.release]
strip = "debuginfo"
opt-level = "z"
lto = true

[dependencies]
# Used as a library only: DRM/KMS, GBM, EGL and libinput, with no Wayland
# server and no seat manager. EVE has neither logind nor udev-backed seats.
smithay = { version = "0.7", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "renderer_gl",
    "renderer_glow",
] }

egui = "0.33"
egui_glow = { version = "0.33", default-features = false }
glow = "0.16"

anyhow = "1"
log = "0.4"
libc = "0.2"

# Pillar's monitor contract: the generated types and the framed client copied
# from pkg/monitor.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["base64"] }
serde_repr = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
ipnet = { version = "2", features = ["serde", "json"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
macaddr = { version = "1", features = ["serde"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# QEMU's D-Bus display is a peer-to-peer connection over a socket QEMU itself
# authenticates, so no bus daemon and no session bus are involved.
zbus = { version = "5", default-features = false, features = [
    "tokio",
    "p2p",
    "blocking-api",
] }
zvariant = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
