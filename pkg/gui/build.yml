org: lfedge
image: eve-gui
network: yes
config:
  pid: host
  binds:
    # tty/console devices, the DRM card and the evdev input devices
    - /dev:/dev
    # QEMU's D-Bus display sockets, and our log
    - /run:/run
    - /persist:/persist:rshared,rbind

  devices:
    - path: "/dev/tty"
      type: c
      major: 5
      minor: 0
      mode: 0666
    - path: "/dev/console"
      type: c
      major: 5
      minor: 1
      mode: 0666
    - path: "/dev/tty0"
      type: c
      major: 4
      minor: 0
      mode: 0666
    # we run the GUI on tty2, as the TUI monitor did
    - path: "/dev/tty2"
      type: c
      major: 4
      minor: 2
      mode: 0666
    # DRM: scanout (cardN) and the render node used for EGL/GBM
    - path: "/dev/dri/card0"
      type: c
      major: 226
      minor: 0
      mode: 0660
    - path: "/dev/dri/card1"
      type: c
      major: 226
      minor: 1
      mode: 0660
    - path: "/dev/dri/renderD128"
      type: c
      major: 226
      minor: 128
      mode: 0666
    # direct access to the kernel log
    - path: "/dev/kmsg"
      type: c
      major: 1
      minor: 11
      mode: 0660
  capabilities:
    - all
  rootfsPropagation: shared
