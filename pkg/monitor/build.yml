org: lfedge
image: eve-monitor
network: yes
config:
  pid: host
  binds:
    # for tty/console devices
    - /dev:/dev
    # for temporary files and UNIX socket
    - /run:/run
    # to save logs
    - /persist:/persist:rshared,rbind

  devices:
    - path: "/dev/tty"
      type: c
      major: 5
      minor: 0
      mode: 0666
    - path: "/dev/console"
      type: c
      major: 5
      minor: 1
      mode: 0666
    - path: "/dev/tty0"
      type: c
      major: 4
      minor: 0
      mode: 0666
    - path: "/dev/ttyS0"
      type: c
      major: 4
      minor: 64
      mode: 0666
    - path: "/dev/ttyAMA0"
      type: c
      major: 204
      minor: 64
      mode: 0666
    # we run the monitor on tty2
    - path: "/dev/tty2"
      type: c
      major: 4
      minor: 2
      mode: 0666
    # DRM: scanout (cardN) and the render node used for EGL/GBM, for the gui
    # frontend. pick_card probes card0..card3: a box with a discrete GPU
    # alongside the iGPU, or an extra virtio-gpu, can put the connected head
    # on card2. A node missing from this list is EACCES, not ENOENT, and the
    # console would restart in a loop blaming the display.
    - path: "/dev/dri/card0"
      type: c
      major: 226
      minor: 0
      mode: 0660
    - path: "/dev/dri/card1"
      type: c
      major: 226
      minor: 1
      mode: 0660
    - path: "/dev/dri/card2"
      type: c
      major: 226
      minor: 2
      mode: 0660
    - path: "/dev/dri/card3"
      type: c
      major: 226
      minor: 3
      mode: 0660
    - path: "/dev/dri/renderD128"
      type: c
      major: 226
      minor: 128
      mode: 0666
    # direct access to the kernel log
    - path: "/dev/kmsg"
      type: c
      major: 1
      minor: 11
      mode: 0660
  capabilities:
    - all
  rootfsPropagation: shared
